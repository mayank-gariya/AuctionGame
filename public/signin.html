<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — Auction House</title>
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
  <main class="auth-page">
    <section class="auth-intro">
      <a class="brand" href="/">
        <span class="brand-mark">AH</span>
        <span>Auction House</span>
      </a>
      <div class="intro-content">
        <p class="eyebrow">WELCOME BACK</p>
        <h1>The next bid<br>could be yours.</h1>
        <p>Sign in to follow auctions, place bids and manage your account.</p>
      </div>
      <a class="back-link" href="/">← Back to auctions</a>
    </section>

    <section class="auth-panel">
      <div class="auth-form-wrap">
        <div class="form-heading">
          <p class="eyebrow">ACCOUNT</p>
          <h2>Sign in</h2>
          <p>Enter your details to continue.</p>
        </div>

        <form id="signinForm" novalidate>
          <div class="field">
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
            <small class="field-error" id="emailError"></small>
          </div>

          <div class="field">
            <div class="label-row">
              <label for="password">Password</label>
              <a href="#" class="muted-link">Forgot password?</a>
            </div>
            <input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
            <small class="field-error" id="passwordError"></small>
          </div>

          <div class="form-message" id="signinMessage"></div>
          <button class="button button-dark full-width" type="submit">Sign in</button>
        </form>

        <p class="switch-auth">Don't have an account? <a href="/signup.html">Create one</a></p>
      </div>
    </section>
  </main>

  <script src="/js/auth.js"></script>
</body>
</html>
